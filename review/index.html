    <script>
      (function () {
        var SEND_TO = 'AW-18537296284/SX1UCMbuxaodEJzjoodF';
        var lastHref = '';
        var lastAt = 0;

        function conversionPayload(extra) {
          var payload = {
            send_to: SEND_TO,
            transport_type: 'beacon',
            lead_source: window.DUNIS_LEAD_SOURCE || 'W'
          };
          if (extra) {
            for (var key in extra) {
              if (Object.prototype.hasOwnProperty.call(extra, key)) payload[key] = extra[key];
            }
          }
          return payload;
        }

        function whatsappHref(anchor) {
          var url;
          try {
            url = new URL(anchor.href, window.location.href);
          } catch (err) {
            return '';
          }
          if (url.protocol === 'whatsapp:') return url.href;
          var host = url.hostname.toLowerCase().replace(/^www\./, '');
          if (host === 'wa.me' || host === 'api.whatsapp.com') return url.href;
          return '';
        }

        function opensNewTab(anchor, event) {
          var target = (anchor.getAttribute('target') || '').toLowerCase();
          return target === '_blank' || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button === 1;
        }

        function onClick(event) {
          var node = event.target;
          if (!node) return;
          if (node.nodeType === 3) node = node.parentElement;
          var anchor = node && node.closest ? node.closest('a[href]') : null;
          if (!anchor) return;

          var href = whatsappHref(anchor);
          if (!href) return;

          var newTab = event.type === 'auxclick' || opensNewTab(anchor, event);
          var now = Date.now();
          if (href === lastHref && now - lastAt < 1000) {
            if (!newTab) event.preventDefault();
            return;
          }
          if (typeof window.gtag !== 'function') return;

          lastHref = href;
          lastAt = now;

          var done = false;
          function go() {
            if (done) return;
            done = true;
            window.location.href = href;
          }

          if (newTab) {
            try {
              window.gtag('event', 'conversion', conversionPayload());
            } catch (err) {}
            return;
          }

          event.preventDefault();
          try {
            window.gtag('event', 'conversion', conversionPayload({ event_callback: go }));
          } catch (err) {
            go();
            return;
          }
          window.setTimeout(go, 1000);
        }

        document.addEventListener('click', onClick, true);
        document.addEventListener('auxclick', onClick, true);
      })();
    </script>
    <script>
      (function () {
        var lastAt = 0;
        document.addEventListener('click', function (event) {
          var node = event.target;
          if (!node) return;
          if (node.nodeType === 3) node = node.parentElement;
          var anchor = node && node.closest ? node.closest('a[href]') : null;
          if (!anchor) return;
          var href = anchor.getAttribute('href') || '';
          if (href.toLowerCase().indexOf('mailto:') !== 0) return;
          var now = Date.now();
          if (now - lastAt < 1000) return;
          lastAt = now;
          if (typeof window.gtag !== 'function') return;
          try {
            window.gtag('event', 'email_click', { transport_type: 'beacon' });
          } catch (err) {}
        }, true);
      })();
    </script>
    <title>Thanks for touring with Dunis Tours | Roatan Dunis Tours</title>

    <style>
        :root { --ink:#2a211c; --muted:#7a6a58; --paper:#f6efe4; --rust:#c45c2a; --line:#e4d5c2; }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
        }
        img { max-width: 100%; height: auto; display: block; }
        .wrap {
            width: 100%;
            max-width: 26rem;
            margin: 0 auto;
            padding: 1.75rem 1.25rem 2.5rem;
        }
        .logo {
            display: block;
            width: max-content;
            margin: 0 auto 1.25rem;
            background: #fff;
            border-radius: 1.25rem;
            padding: 0.35rem 0.55rem;
        }
        .logo img { width: 7.5rem; height: auto; }
        h1 {
            font-family: Fraunces, Georgia, serif;
            font-weight: 500;
            font-size: 1.85rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
            text-align: center;
            margin: 0 0 0.65rem;
        }
        .lead {
            text-align: center;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.45;
            margin: 0 0 1.5rem;
        }
        .note {
            margin: 0 0 0.45rem;
            text-align: center;
            color: var(--rust);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-decoration: none;
            border-radius: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary {
            min-height: 4.5rem;
            padding: 1rem 1.25rem;
            background: var(--rust);
            color: #fff;
            font-size: 1.35rem;
            box-shadow: 0 10px 24px rgba(196, 92, 42, 0.22);
        }
        .btn-primary:hover { background: #b04f22; }
        .btn-secondary {
            min-height: 3.75rem;
            margin-top: 0.75rem;
            padding: 0.85rem 1.1rem;
            background: #fffdf8;
            color: var(--ink);
            border: 1px solid var(--line);
            font-size: 1.1rem;
        }
        .btn-secondary:hover { background: #fff; }
        .btn:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }
        .contact {
            margin: 2rem 0 0;
            text-align: center;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .contact a {
            color: var(--ink);
            font-weight: 700;

            text-underline-offset: 3px;
        }

            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 3rem;
            margin: 0.85rem 0 0;
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            border: 1.5px solid var(--ink);
            background: #fffdf8;
            color: var(--ink);
            font-weight: 700;

        }

<body>

        <p class="lead">Your review means so much to us. Thank you! Pick one:</p>
        <div id="review-choices"></div>

        <a class="email-line" href="mailto:roatandunistours@gmail.com?subject=Tour%20inquiry&amp;body=Date%20on%20Roat%C3%A1n%3A%20%20%2F%20Number%20of%20people%3A%20%20%2F%20Tour%20you%27re%20interested%20in%3A%20">Prefer email? Email us</a>
    </main>
    <script>
      (function () {
        var cfg = window.REVIEW_PAGE || {};
        var platforms = Array.isArray(cfg.platforms) ? cfg.platforms : [];
        var featured = null;
        var rest = [];
        for (var i = 0; i < platforms.length; i++) {
          var item = platforms[i];
          if (!featured && item && item.id === cfg.featured) featured = item;
          else if (item) rest.push(item);
        }
        if (!featured && rest.length) featured = rest.shift();
        var root = document.getElementById('review-choices');
        if (!root || !featured) return;

        function button(item, primary) {
          var link = document.createElement('a');
          link.className = primary ? 'btn btn-primary' : 'btn btn-secondary';
          link.href = item.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.setAttribute('data-platform', item.name);
          link.textContent = item.name;
          var sr = document.createElement('span');
          sr.className = 'sr';
          sr.textContent = ' (opens in a new tab)';
          link.appendChild(sr);
          return link;
        }

        var note = document.createElement('p');
        note.className = 'note';
        note.id = 'featured-note';
        note.textContent = 'Most helpful right now';
        var primary = button(featured, true);
        primary.setAttribute('aria-describedby', 'featured-note');
        root.appendChild(note);
        root.appendChild(primary);
        for (var j = 0; j < rest.length; j++) root.appendChild(button(rest[j], false));

        root.addEventListener('click', function (event) {
          var node = event.target;
          if (!node) return;
          if (node.nodeType === 3) node = node.parentElement;
          var anchor = node && node.closest ? node.closest('a[data-platform]') : null;
          if (!anchor || typeof window.gtag !== 'function') return;
          try {
            window.gtag('event', 'review_click', {
              platform: anchor.getAttribute('data-platform'),
              transport_type: 'beacon'
            });
          } catch (err) {}
        });
      })();
    </script>
</body>
